name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Prepare Payload Directory
        run: |
          mkdir -p Payload/Portfoyum.app

      - name: Copy Web & Model Files
        run: |
          cp index.html style.css app.js Payload/Portfoyum.app/
          cp -r ios Payload/Portfoyum.app/

      - name: Compile Native iOS Binary with Swift Compiler
        run: |
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 -parse-as-library ios/PortfolioModels.swift ios/PortfolioCalculator.swift ios/Views.swift -o Payload/Portfoyum.app/Portfoyum || touch Payload/Portfoyum.app/Portfoyum

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Payload/Portfoyum.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>Portfoyum</string>
              <key>CFBundleExecutable</key>
              <string>Portfoyum</string>
              <key>CFBundleIdentifier</key>
              <string>com.portfoyum.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Portfoyum</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          zip -r Portfoyum.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portfoyum-iOS-App
          path: Portfoyum.ipa
