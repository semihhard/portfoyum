name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Payload Directory Structure
        run: |
          rm -rf Payload Portfoyum.ipa
          mkdir -p Payload/Portfoyum.app

      - name: Copy App Assets & Info.plist
        run: |
          cp Info.plist Payload/Portfoyum.app/Info.plist
          cp index.html style.css app.js Payload/Portfoyum.app/ 2>/dev/null || true

      - name: Compile Executable Binary
        run: |
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios16.0 \
            Sources/Portfoyum/PortfolioModels.swift \
            Sources/Portfoyum/PortfolioCalculator.swift \
            Sources/Portfoyum/Views.swift \
            Sources/Portfoyum/PortfoyumApp.swift \
            -o Payload/Portfoyum.app/Portfoyum

      - name: Package IPA
        run: |
          zip -r Portfoyum.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portfoyum-iOS-App
          path: Portfoyum.ipa
