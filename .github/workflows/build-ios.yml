name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Capacitor Dependencies
        run: |
          npm install

      - name: Prepare Web Assets Folder
        run: |
          mkdir -p www
          cp index.html style.css app.js www/

      - name: Add and Sync Capacitor iOS Project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build Authentic Xcode iOS Binary Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p ../../Payload
          cp -r App.xcarchive/Products/Applications/App.app ../../Payload/Portfoyum.app

      - name: Package IPA
        run: |
          zip -r Portfoyum.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portfoyum-iOS-App
          path: Portfoyum.ipa
